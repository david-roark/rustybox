name: Build Multi-Platform Portable Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 Portable Executable
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: RustyBox-windows-x64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/rust-remote-toolbox.exe

          # Linux (Ubuntu / Debian / Fedora) Portable Binary
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: RustyBox-linux-x64
            binary_path: target/x86_64-unknown-linux-gnu/release/rust-remote-toolbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit & integration tests
        run: cargo test --target ${{ matrix.target }} -- --test-threads=4

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage named binary
        shell: bash
        run: |
          cp "${{ matrix.binary_path }}" "${{ matrix.artifact_name }}"
          ls -lh "${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Attach Binaries to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
