<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243247"/>
      <stop offset="100%" stop-color="#131c2b"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0b101b"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3b54"/>
      <stop offset="100%" stop-color="#141d2c"/>
    </linearGradient>
    <filter id="cubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#1f293d" stroke-width="3"/>

  <!-- Network Orbit Waves / Outer Radar Rings (Expanding close to edges) -->
  <ellipse cx="256" cy="272" rx="215" ry="92" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="10 8"/>
  <ellipse cx="256" cy="272" rx="180" ry="76" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.55"/>

  <!-- Orbiting Data Nodes -->
  <circle cx="48" cy="272" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#cubeGlow)"/>
  <circle cx="464" cy="272" r="11" fill="#f97316" stroke="#ffffff" stroke-width="2" filter="url(#cubeGlow)"/>
  <circle cx="395" cy="225" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
  <circle cx="120" cy="320" r="8" fill="#f97316" filter="url(#cubeGlow)"/>

  <!-- LARGE 3D Isometric Network Cube (Centered and scaled up to border)
       Center = (256, 268)
       Span: X from 90 to 422 (width = 332px)
       Span: Y from 78 to 445 (height = 367px)
  -->
  <g id="cube">
    <!-- Top Face: (256, 78) -> (422, 172) -> (256, 266) -> (90, 172) -->
    <polygon points="256,78 422,172 256,266 90,172" fill="url(#topFace)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Left Face (Terminal Screen): (90, 172) -> (256, 266) -> (256, 442) -> (90, 348) -->
    <polygon points="90,172 256,266 256,442 90,348" fill="url(#leftFace)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Right Face (Server Port Mesh): (256, 266) -> (422, 172) -> (422, 348) -> (256, 442) -->
    <polygon points="256,266 422,172 422,348 256,442" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>

    <!-- Top Face: Circuit Matrix Grid & Center Orange Node -->
    <line x1="173" y1="125" x2="339" y2="219" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <line x1="339" y1="125" x2="173" y2="219" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>
    <circle cx="256" cy="172" r="10" fill="#f97316" stroke="#ffffff" stroke-width="2" filter="url(#cubeGlow)"/>

    <!-- Left Face: Big Terminal Prompt >_ -->
    <!-- Transformed to match 30-deg isometric left plane -->
    <g transform="matrix(0.866 0.5 0 1 115 235)">
      <!-- Prompt Chevron > -->
      <path d="M 12 18 L 32 38 L 12 58" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Cursor Underscore _ -->
      <line x1="46" y1="58" x2="80" y2="58" stroke="#f97316" stroke-width="6.5" stroke-linecap="round"/>
    </g>

    <!-- Right Face: Ethernet / Fiber Ports with LEDs -->
    <!-- Transformed to match isometric right plane -->
    <g transform="matrix(0.866 -0.5 0 1 278 355)">
      <!-- Port 1 -->
      <rect x="15" y="12" width="28" height="18" rx="4" fill="#0b0f19" stroke="#64748b" stroke-width="2"/>
      <circle cx="56" cy="21" r="5" fill="#22c55e" stroke="#86efac" stroke-width="1.5" filter="url(#cubeGlow)"/>
      
      <!-- Port 2 -->
      <rect x="15" y="44" width="28" height="18" rx="4" fill="#0b0f19" stroke="#64748b" stroke-width="2"/>
      <circle cx="56" cy="53" r="5" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5" filter="url(#cubeGlow)"/>
      
      <!-- Port 3 -->
      <rect x="15" y="76" width="28" height="18" rx="4" fill="#0b0f19" stroke="#64748b" stroke-width="2"/>
      <circle cx="56" cy="85" r="5" fill="#f97316" stroke="#fed7aa" stroke-width="1.5" filter="url(#cubeGlow)"/>
    </g>

    <!-- Glowing Corner Vertices (Key connection endpoints) -->
    <circle cx="256" cy="78" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
    <circle cx="422" cy="172" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
    <circle cx="90" cy="172" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
    <circle cx="256" cy="266" r="10" fill="#f97316" stroke="#ffedd5" stroke-width="2" filter="url(#cubeGlow)"/>
    <circle cx="256" cy="442" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
    <circle cx="90" cy="348" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
    <circle cx="422" cy="348" r="8" fill="#38bdf8" filter="url(#cubeGlow)"/>
  </g>
</svg>