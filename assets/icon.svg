<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Network Globe Lat/Long Arcs -->
  <g transform="translate(256, 256)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2.5" fill="none">
    <!-- Outer circle -->
    <circle r="145" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3"/>
    <!-- Equator and parallels -->
    <line x1="-145" y1="0" x2="145" y2="0" stroke-dasharray="6 6"/>
    <ellipse rx="145" ry="60"/>
    <ellipse rx="145" ry="110"/>
    <!-- Meridians -->
    <ellipse rx="65" ry="145"/>
    <ellipse rx="110" ry="145"/>
    <line x1="0" y1="-145" x2="0" y2="145" stroke-dasharray="6 6"/>
  </g>

  <!-- Connecting Data Lines (Network Paths) -->
  <g stroke="#60a5fa" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="165" y1="180" x2="256" y2="256"/>
    <line x1="345" y1="185" x2="256" y2="256"/>
    <line x1="150" y1="310" x2="256" y2="256"/>
    <line x1="360" y1="315" x2="256" y2="256"/>
    <line x1="256" y1="140" x2="256" y2="256"/>
    <line x1="256" y1="370" x2="256" y2="256"/>
    <line x1="165" y1="180" x2="256" y2="140" stroke-dasharray="4 4" stroke="#fb923c" stroke-width="2.5"/>
    <line x1="345" y1="185" x2="256" y2="140" stroke-dasharray="4 4" stroke="#fb923c" stroke-width="2.5"/>
    <line x1="150" y1="310" x2="256" y2="370" stroke-dasharray="4 4" stroke="#fb923c" stroke-width="2.5"/>
    <line x1="360" y1="315" x2="256" y2="370" stroke-dasharray="4 4" stroke="#fb923c" stroke-width="2.5"/>
  </g>

  <!-- Peripheral Server Nodes -->
  <g filter="url(#glow)">
    <circle cx="165" cy="180" r="14" fill="#38bdf8"/>
    <circle cx="165" cy="180" r="6" fill="#ffffff"/>

    <circle cx="345" cy="185" r="14" fill="#38bdf8"/>
    <circle cx="345" cy="185" r="6" fill="#ffffff"/>

    <circle cx="150" cy="310" r="14" fill="#38bdf8"/>
    <circle cx="150" cy="310" r="6" fill="#ffffff"/>

    <circle cx="360" cy="315" r="14" fill="#38bdf8"/>
    <circle cx="360" cy="315" r="6" fill="#ffffff"/>

    <circle cx="256" cy="140" r="15" fill="#f97316"/>
    <circle cx="256" cy="140" r="6" fill="#ffffff"/>

    <circle cx="256" cy="370" r="15" fill="#f97316"/>
    <circle cx="256" cy="370" r="6" fill="#ffffff"/>
  </g>

  <!-- Central Hub Node (RustyBox Terminal Gateway) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="48" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="5"/>
    <circle cx="256" cy="256" r="40" fill="#1e293b"/>
    <!-- Terminal prompt >_ in center -->
    <path d="M 238 244 L 248 256 L 238 268" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="256" y1="268" x2="274" y2="268" stroke="#f97316" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>